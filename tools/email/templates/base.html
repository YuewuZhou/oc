<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}{% endblock %}</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background: #f6f7fb;
        color: #1f2937;
        font-family: Arial, sans-serif;
      }
      .wrapper {
        width: 100%;
        padding: 24px;
        box-sizing: border-box;
      }
      .card {
        max-width: 640px;
        margin: 0 auto;
        background: #ffffff;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 8px 32px rgba(15, 23, 42, 0.08);
      }
      .header {
        padding: 28px 32px 0;
      }
      .content {
        padding: 24px 32px 8px;
      }
      .footer {
        padding: 0 32px 28px;
        font-size: 12px;
        color: #6b7280;
      }
      .badge {
        display: inline-block;
        padding: 4px 10px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .badge.info { background: #dbeafe; color: #1d4ed8; }
      .badge.warning { background: #fef3c7; color: #b45309; }
      .badge.error { background: #fee2e2; color: #b91c1c; }
      a {
        color: #2563eb;
        word-break: break-word;
      }
      @media (max-width: 640px) {
        .wrapper { padding: 12px; }
        .header, .content, .footer { padding-left: 20px; padding-right: 20px; }
      }
    </style>
  </head>
  <body>
    <div class="wrapper">
      <div class="card">
        <div class="header">
          <h1 style="margin: 0; font-size: 24px; line-height: 1.3;">{% block subject %}{% endblock %}</h1>
        </div>
        <div class="content">
          {% block content %}{% endblock %}
        </div>
        <div class="footer">Delivered by the email notification service.</div>
      </div>
    </div>
  </body>
</html>
